server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: customers
          uri: lb://customer-service
          predicates:
            - Path=/customers/**
        - id: billing
          uri: lb://billing-service
          predicates:
            - Path=/billing/**
        - id: notifications
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
